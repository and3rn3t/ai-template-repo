# Default: Node.js quality pipeline on pnpm (and3rn3t standard).
# pnpm version comes from the `packageManager` field in package.json.
# npm repo? Drop the pnpm/action-setup step, set `cache: npm`, and use
# `npm ci` / `npm run <script>` below.
# Python repos: use profiles/python/ci.yml instead.
#
# Shorter alternative — call the shared reusable workflow instead:
#   jobs:
#     quality:
#       uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@v1
#       with:
#         command: pnpm lint && pnpm type-check && pnpm test && pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type-check & Test
    # This repo is a template with no package.json, so there is nothing to run
    # here. Repos created from it have a different name and run the job.
    if: github.repository != 'and3rn3t/ai-template-repo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Format check
        run: pnpm format:check
      - name: Tests with coverage
        run: pnpm test
      - name: Build
        run: pnpm build
